<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Ledger">
  <defs>
    <linearGradient id="bgMetal" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f6f8"/>
      <stop offset="28%" stop-color="#dce1e8"/>
      <stop offset="55%" stop-color="#c4cad4"/>
      <stop offset="82%" stop-color="#aeb6c2"/>
      <stop offset="100%" stop-color="#959eac"/>
    </linearGradient>
    <linearGradient id="bgSheen" x1="180" y1="0" x2="520" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bookFace" x1="312" y1="220" x2="712" y2="804" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#454d56"/>
      <stop offset="100%" stop-color="#1c2127"/>
    </linearGradient>
    <linearGradient id="bookSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15181c"/>
      <stop offset="100%" stop-color="#2a3139"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f1419" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgMetal)"/>
  <rect width="1024" height="1024" fill="url(#bgSheen)"/>

  <g filter="url(#bookShadow)">
    <rect x="248" y="208" width="528" height="608" rx="56" fill="url(#bookFace)"/>
    <rect x="248" y="208" width="96" height="608" rx="56" fill="url(#bookSpine)"/>
    <rect x="296" y="208" width="48" height="608" fill="#0f1215" opacity="0.35"/>

    <g fill="#e8ecf0">
      <rect x="380" y="300" width="48" height="360" rx="12"/>
      <rect x="380" y="300" width="280" height="48" rx="12"/>
      <rect x="612" y="300" width="48" height="200" rx="12"/>
      <rect x="448" y="420" width="212" height="44" rx="10"/>
      <rect x="448" y="520" width="180" height="44" rx="10"/>
      <rect x="448" y="620" width="148" height="44" rx="10"/>
    </g>

    <rect x="620" y="548" width="36" height="88" rx="10" fill="#4ade80"/>
    <rect x="668" y="512" width="36" height="124" rx="10" fill="#fb7185"/>
    <rect x="716" y="576" width="36" height="60" rx="10" fill="#60a5fa"/>

    <circle cx="692" cy="368" r="52" fill="url(#coin)"/>
    <circle cx="692" cy="368" r="38" fill="none" stroke="#14532d" stroke-width="10" opacity="0.35"/>
    <rect x="672" y="352" width="40" height="32" rx="8" fill="#14532d" opacity="0.5"/>
  </g>
</svg>
